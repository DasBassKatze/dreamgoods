name: Dev-GPT validation
on:
  push:
    branches: [Dev-GPT]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: dreamgoods_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio -d dreamgoods_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://studio:studio@127.0.0.1:5432/dreamgoods_test
      TEST_DATABASE_URL: postgresql+psycopg://studio:studio@127.0.0.1:5432/dreamgoods_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q dreamgoods scripts migrations
      - run: python -m alembic upgrade head
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
      - run: python -m pytest -q
        env:
          DREAMGOODS_PG_BIN: /usr/lib/postgresql/16/bin
      - run: python -m alembic downgrade 0012 && python -m alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
