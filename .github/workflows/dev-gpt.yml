name: Dev-GPT checks
on:
  push:
    branches: [Dev-GPT, dev-gpt, desktop-windows, Dev-UI]
  pull_request:
    branches: [dev-ui, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dreamgoods_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dreamgoods_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dreamgoods_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q dreamgoods migrations tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- dreamgoods/web
        if: github.event_name != 'push' || github.ref != 'refs/heads/Dev-UI'
      - name: Browser budget smoke test (mocked API)
        run: >-
          npm exec --yes --package=playwright@1.51.1 -- sh -c
          'PLAYWRIGHT_MODULE="$(dirname "$(readlink -f "$(command -v playwright)")")"
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-budget-smoke.cjs'
      - name: Browser manual reference smoke test (mocked paid AI)
        run: >-
          npm exec --yes --package=playwright@1.51.1 -- sh -c
          'PLAYWRIGHT_MODULE="$(dirname "$(readlink -f "$(command -v playwright)")")"
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-manual-reference-smoke.cjs'
      - name: Desktop UI smoke test (mocked API)
        run: >-
          npm exec --yes --package=playwright@1.51.1 -- sh -c
          'PLAYWRIGHT_MODULE="$(dirname "$(readlink -f "$(command -v playwright)")")"
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-desktop-smoke.cjs'
      - name: Ergonomics and selection browser scenarios
        run: >-
          npm exec --yes --package=playwright@1.51.1 -- sh -c
          'PLAYWRIGHT_MODULE="$(dirname "$(readlink -f "$(command -v playwright)")")"
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/browser-ergonomics.cjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-preview
          path: |
            /tmp/dgdesktop-*.png
            /tmp/dg-ui-*.png

      - name: Export compiled interface for repository synchronization
        if: github.event_name == 'push' && github.ref == 'refs/heads/Dev-UI'
        run: |
          python - <<'PY'
          import base64, json, pathlib
          root = pathlib.Path('dreamgoods/web')
          files = [{'path': p.as_posix(), 'base64': base64.b64encode(p.read_bytes()).decode('ascii')} for p in sorted(root.rglob('*')) if p.is_file()]
          print('DG_COMPILED_ASSETS=' + json.dumps(files, separators=(',', ':')))
          for name in ['login', 'workspace']:
              path = pathlib.Path('/tmp/dgdesktop-' + name + '.png')
              print('DG_PREVIEW_' + name + '=' + base64.b64encode(path.read_bytes()).decode('ascii'))
          PY
